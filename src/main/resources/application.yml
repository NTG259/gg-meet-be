spring:
    application:
        name: BE

    # Kích hoạt mặc định profile dev khi chạy local
    profiles:
        active: dev

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true

    security:
        oauth2:
            client:
                registration:
                    google:
                        scope:
                            - email
                            - profile