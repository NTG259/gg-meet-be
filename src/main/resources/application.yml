spring:
    application:
        name: BE

    # Kích hoạt mặc định profile dev khi chạy local
    profiles:
        active: dev

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true

    security:
        oauth2:
            client:
                registration:
                    google:
                        scope:
                            - email
                            - profile

# JWT Configuration
jwt-secret: "your-secret-key-change-this-in-production-this-must-be-at-least-32-characters-long-12345"
jwt-expiration: 86400000
