spring:
  application:
    name: BE

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}

  security:
    oauth2:
      client:
        registration:
          google:
            scope:
              - email
              - profile

server:
  port: ${SERVER_PORT:8080}
