<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Xác Thực Tài Khoản</title>
</head>
<body>
<div style="font-family: Arial, sans-serif; text-align: center; color: #333;">
    <h2>Chào mừng bạn đến với Kallio!</h2>
    <p>Để hoàn tất quá trình đăng ký, vui lòng sử dụng mã xác thực dưới đây:</p>

    <div style="margin: 20px auto; padding: 15px 30px; background-color: #f4f4f9; border: 2px dashed #007bff; border-radius: 8px; display: inline-block;">
        <span th:text="${verifyCode}" style="font-size: 28px; font-weight: bold; color: #007bff; letter-spacing: 5px;">
            Verification code</span>
    </div>

    <p style="color: #777; margin-top: 20px;">Mã này sẽ hết hạn sau 15 phút.</p>
    <p style="color: #999; font-size: 12px;">Nếu bạn không thực hiện yêu cầu này, vui lòng bỏ qua email.</p>
</div>
</body>
</html>
