<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Xác Thực Tài Khoản</title>
</head>
<body>
<div style="font-family: Arial, sans-serif; text-align: center;">

    <a th:href="${confirmationUrl}"
