spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/kallio?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:kallio}
    password: ${DB_PASSWORD:change-me}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}

  mail:
    host: ${MAIL_HOST:smtp}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:60000}

livekit:
  api-key: ${LIVEKIT_API_KEY:devkey}
  api-secret: ${LIVEKIT_API_SECRET:secret}
  host: ${LIVEKIT_HOST:http://livekit:7880}
  ws-url: ${LIVEKIT_WS_URL:ws://localhost:7880}

jwt:
  secret: ${JWT_SECRET:ZGV2LWp3dC1zZWNyZXQtMzItYnl0ZXMtbWluaW11bS0xMjM0}
  expiration: ${JWT_EXPIRATION_SECONDS:86400}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION_SECONDS:604800}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.meet.BE.controller.socket: ${LOGGING_LEVEL_MEETING_SOCKET:INFO}

app:
  base-url: ${BACKEND_BASE_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:no-reply@localhost}
    from-name: ${MAIL_FROM_NAME:Kallio}
  frontend:
    base-url: ${FRONTEND_URL:http://localhost:3000}
  scheduler:
    activation-fixed-rate-ms: ${SCHEDULER_ACTIVATION_FIXED_RATE_MS:2000}
